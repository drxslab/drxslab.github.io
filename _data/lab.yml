name_en: Design and Realization of Interdisciplinary Intelligent Systems
short_name: DrXs Lab

institute_en: Institute of Trustworthy Embodied AI
institute_zh: 可信具身智能研究院
institute_url: https://teai.fudan.edu.cn
university_en: Fudan University
university_zh: 复旦大学

# One-line research slogan shown under the lab name in the hero.
slogan_en: Complexity, Safety, Socialization
slogan_zh: 任务难度，安全交互，社会化融合

# Two or three sentences below the slogan.
hero_intro: >
  The lab is led by [Wenqiang Xu](https://wenqiangx.github.io), Assistant
  Professor at the Institute of Trustworthy Embodied AI, whose research centers
  on the safety of robot interaction.


  We study how robots can work in physical contact with people and objects
  without putting them at risk — spanning human motion mechanisms, omni-modal
  perception and high-frequency force control, safe interaction policies, and the
  design of novel embodiments and sensors.

